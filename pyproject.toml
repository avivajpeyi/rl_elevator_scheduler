[project]
name = "elevator-scheduler-simple"
version = "0.1.0"
description = "Minimal standalone elevator scheduling examples with a heuristic and PyTorch DQN."
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pillow>=10",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
simple-compare = "examples.compare_simple:main"
simple-animate = "examples.animate_elevator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simple", "examples"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
